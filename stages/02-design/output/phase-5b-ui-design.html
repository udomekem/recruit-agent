<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase 5B UI design · Recruit Agent in the Hira style</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Tokens from references/design/hira/DESIGN-BRIEF.md */
:root{color-scheme:light dark;
  --bg:light-dark(#f7f7f4,#16191c);--paper:light-dark(#fff,#202429);--text:light-dark(#202529,#f1f2ef);
  --muted:light-dark(#69716f,#adb5b4);--line:light-dark(#e5e7e2,#363c40);--soft:light-dark(#f0f2ee,#292f32);
  --blue:light-dark(#354fd5,#a4b4ff);--selected:light-dark(#eef1ff,#29334f);--green:light-dark(#32725b,#8ed2b1);
  --green-bg:light-dark(#e9f5ee,#213d32);--red:light-dark(#a14949,#ecaaaa);--red-bg:light-dark(#fbeeee,#3d2525);
  --amber:light-dark(#8a5a00,#f0c674);--amber-bg:light-dark(#fff5e0,#3a3020)}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px/1.55 'DM Sans',system-ui,sans-serif;color:var(--text);background:var(--bg);padding:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
h1,h2,h3,p{margin:0}[hidden]{display:none!important}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app{max-width:1280px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:18px;overflow:clip}

/* Header */
.hdr{display:flex;align-items:center;gap:26px;padding:18px 29px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{font:750 26px 'Manrope',sans-serif;letter-spacing:-1.4px;display:flex;align-items:center;gap:10px}
.mark{display:flex;gap:3px;transform:rotate(-12deg)}.mark b{display:block;background:var(--blue);width:6px;height:24px;border-radius:3px}
.mark b:nth-child(2){height:18px;margin-top:6px}.mark b:nth-child(3){height:12px;margin-top:12px}
.crumb{border-left:1px solid var(--line);padding-left:22px;color:var(--muted);font-size:12px;white-space:nowrap}
.crumb b{color:var(--text);font-weight:500}
.nav{display:flex;gap:2px;margin-left:8px}
.nav button{border:0;background:transparent;padding:8px 12px;border-radius:7px;color:var(--muted);font-size:13px;display:flex;gap:7px;align-items:center;white-space:nowrap}
.nav button[aria-current=page]{background:var(--text);color:var(--paper)}
.nav .count{font-size:11px;opacity:.8}
.acct{margin-left:auto;display:flex;align-items:center;gap:9px}
.acct small{display:block;color:var(--muted);font-size:11px}
.av{display:grid;place-items:center;flex-shrink:0;width:40px;height:40px;border-radius:50%;background:var(--soft);font:600 12px 'Manrope',sans-serif}
.acct .av{width:33px;height:33px;background:var(--selected);color:var(--blue)}

/* Page */
.content{padding:30px 29px 18px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:25px;margin-bottom:28px}
.eyebrow{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);font-weight:650;margin-bottom:7px}
h1{font:600 35px/1.2 'Manrope',sans-serif;letter-spacing:-1.5px}
.intro{font-size:13px;color:var(--muted);margin-top:9px;max-width:560px}
.stats{display:flex;gap:27px}.stat{padding-left:24px;border-left:1px solid var(--line)}
.stat strong{display:block;font:500 30px/1.3 'Manrope',sans-serif;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:11px;white-space:nowrap}.stat:last-child strong{color:var(--blue)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px;flex-wrap:wrap}
.seg{display:flex;gap:3px;flex-wrap:wrap}
.seg button{background:transparent;border:0;padding:8px 12px;display:flex;align-items:center;gap:7px;color:var(--muted);border-radius:7px;font-size:12px}
.seg button[aria-pressed=true]{background:var(--text);color:var(--paper)}
.seg button span{opacity:.75;font-size:11px}
.select{font-size:12px;background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:9px 12px;max-width:100%}

/* Workbench */
.bench{display:grid;grid-template-columns:290px minmax(0,1fr);background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:clip}
.queue{border-right:1px solid var(--line);min-width:0}
.search{display:flex;gap:8px;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line);color:var(--muted)}
.search input{width:100%;background:transparent;border:0;font-size:12px;min-width:0}
.qlabel{padding:16px 20px 8px;display:flex;justify-content:space-between;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.row{display:flex;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);padding:18px 20px;background:var(--paper);text-align:left;position:relative;align-items:flex-start}
.row:hover{background:var(--soft)}
.row[aria-pressed=true]{background:var(--selected)}
.row[aria-pressed=true]:before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;background:var(--blue);border-radius:0 3px 3px 0}
.row .av{width:38px;height:38px;font-size:11px}
.rinfo{min-width:0;flex:1}.rname{font-size:13px;font-weight:650;margin-bottom:2px;display:block}
.rrole{font-size:11px;color:var(--muted);display:block;margin-bottom:8px}
.rbot{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:10px;color:var(--muted)}
.dot{display:inline-flex;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
.dot:before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.dot[data-s=Advance],.dot[data-s=Shortlisted],.dot[data-s=Matched]{color:var(--green)}
.dot[data-s=Maybe],.dot[data-s="Needs a job"],.dot[data-s="Needs review"]{color:var(--amber)}
.dot[data-s=Reject],.dot[data-s=Rejected]{color:var(--red)}
.dot[data-s="To decide"]{color:var(--blue)}
.src{font-size:10px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted)}
.empty{padding:35px 20px;color:var(--muted);font-size:13px}
.qfoot{padding:16px 20px;font-size:11px;color:var(--muted)}

.review{min-width:0;display:flex;flex-direction:column}
.rhead{padding:24px 27px 0}
.kicker{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:18px}
.mini{display:flex;gap:5px}
.ib{width:29px;height:29px;border:1px solid var(--line);border-radius:6px;background:var(--paper);display:grid;place-items:center;padding:0}
.ib:disabled{opacity:.3}
.ident{display:flex;gap:16px;align-items:center}
.ident .av{width:58px;height:58px;border-radius:17px;background:var(--selected);color:var(--blue);font-size:17px}
h2{font:600 27px/1.2 'Manrope',sans-serif;letter-spacing:-1px}
.tline{font-size:12px;color:var(--muted);margin-top:6px}
.facts{display:flex;flex-wrap:wrap;gap:14px;margin:18px 0 20px;color:var(--muted);font-size:11px;align-items:center}
.facts span{display:flex;align-items:center;gap:5px}
.reco{display:inline-flex;align-items:baseline;gap:8px;padding:5px 10px;border-radius:8px;background:var(--soft);font-size:12px;color:var(--text)}
.reco strong{font:600 15px 'Manrope',sans-serif}
.tabs{display:flex;gap:23px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:transparent;color:var(--muted);font-size:12px;padding:0 0 12px;position:relative;white-space:nowrap}
.tab[aria-selected=true]{color:var(--blue);font-weight:650}
.tab[aria-selected=true]:after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--blue)}
.panel{padding:22px 27px 25px;min-height:420px}
.slabel{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:20px 0 12px;font-weight:600}
.slabel:first-child{margin-top:0}
.req{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.req:last-child{border-bottom:0}
.verdict{font-size:11px;font-weight:600;border-radius:6px;padding:3px 8px;align-self:start;text-align:center}
.verdict[data-v=met]{background:var(--green-bg);color:var(--green)}
.verdict[data-v=partly]{background:var(--amber-bg);color:var(--amber)}
.verdict[data-v=not]{background:var(--red-bg);color:var(--red)}
.rq{font-size:13px;font-weight:600}.rk{font-size:10px;color:var(--muted);margin-left:6px;font-weight:500;text-transform:uppercase;letter-spacing:.8px}
.quote{font-size:12px;line-height:1.75;color:var(--muted);margin-top:5px;border-left:2px solid var(--line);padding-left:10px}
.summary{font-size:14px;line-height:1.85;color:var(--muted);margin-bottom:20px}
.exp{display:grid;grid-template-columns:30px minmax(0,1fr);gap:11px;margin:0 0 18px}
.cm{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line);border-radius:7px;font:600 12px 'Manrope',sans-serif;background:var(--bg)}
.jt{font-size:13px;font-weight:650}.jm{font-size:11px;color:var(--muted);margin:3px 0 7px}.jd{font-size:12px;line-height:1.8;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;border:1px solid var(--line);padding:4px 9px;border-radius:6px;color:var(--muted)}
.note-box{font-size:12px;color:var(--muted);background:var(--soft);border-radius:8px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start;margin-bottom:18px}
.email{border:1px solid var(--line);border-radius:10px;padding:18px 20px;background:var(--bg);font-size:13px;line-height:1.8;white-space:pre-wrap}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;margin-top:14px}
.check{font-size:11px;display:flex;gap:6px;align-items:center;color:var(--green)}
.bottom{margin-top:auto;padding:16px 27px;border-top:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-weight:550;white-space:nowrap;min-height:39px}
.btn.primary{background:#354fd5;border-color:#354fd5;color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:var(--paper)}
.btn:disabled{opacity:.4;cursor:default}
.kbd{font-size:10px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.7}
.astatus{font-size:11px;color:var(--muted)}
.notice{padding:12px 27px;background:var(--green-bg);font-size:12px;color:var(--green);display:flex;justify-content:space-between;align-items:center;gap:10px}
.notice button{color:inherit;text-decoration:underline;border:0;background:transparent;font-size:12px}
.label{display:block;font-size:12px;font-weight:600;margin:16px 0 8px}
.input{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:11px 12px;font-size:13px}
textarea.input{resize:vertical;min-height:150px;line-height:1.8}
.help{font-size:11px;color:var(--muted);margin-top:8px}
.event{padding:0 0 22px 21px;margin-left:4px;border-left:1px solid var(--line);position:relative;font-size:13px}
.event:before{content:'';height:7px;width:7px;background:var(--blue);position:absolute;left:-4px;top:7px;border-radius:50%}
.event small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.event p{color:var(--muted);font-size:12px;margin-top:5px}
.back{display:none;border:0;background:transparent;color:var(--blue);font-size:12px;gap:5px;align-items:center;padding:5px 0;margin-bottom:16px}
.footer{display:flex;justify-content:space-between;gap:12px;margin-top:15px;color:var(--muted);font-size:10px;flex-wrap:wrap}
.footer span{display:flex;gap:5px;align-items:center}
.app.focus .bench{grid-template-columns:minmax(0,1fr)}.app.focus .queue{display:none}
.app.focus .panel{max-width:840px;width:100%;align-self:center}

/* Tables (jobs, inbox, to do) */
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:clip}
.card+.card{margin-top:18px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chead h3{font:600 15px 'Manrope',sans-serif;letter-spacing:-.3px}
.chead small{color:var(--muted);font-size:11px}
.trow{display:grid;align-items:center;gap:14px;padding:15px 20px;border-bottom:1px solid var(--line);font-size:12px;width:100%;text-align:left;border-left:0;border-right:0;border-top:0;background:var(--paper)}
.trow:last-child{border-bottom:0}
button.trow:hover{background:var(--soft)}
.thead{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:12px;padding-bottom:10px}
.jobs .trow{grid-template-columns:minmax(0,2.2fr) 1.2fr .8fr .8fr .8fr 1fr}
.num{font:500 18px 'Manrope',sans-serif;font-variant-numeric:tabular-nums}
.num.blue{color:var(--blue)}
.t1{font-size:13px;font-weight:650}.t2{font-size:11px;color:var(--muted);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;border-radius:99px;padding:3px 9px;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--green-bg);color:var(--green)}
.inbox .trow{grid-template-columns:minmax(0,2.4fr) minmax(0,1.6fr) minmax(0,1.4fr) 1fr}
.how{font-size:11px;color:var(--muted)}
.mailbox{display:flex;gap:16px;align-items:center;padding:20px;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;font:700 15px 'Manrope',sans-serif;background:var(--bg)}
.mbinfo{flex:1;min-width:200px}.mbinfo .t1{font-size:14px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--green)}
.live:before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px var(--green-bg)}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.rules div{padding:14px 20px;border-right:1px solid var(--line);font-size:12px}
.rules div:last-child{border-right:0}
.rules b{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:600}
.connect{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
.connect>div{padding:28px}
.connect>div+div{border-left:1px solid var(--line);background:var(--bg)}
.provider{display:flex;gap:14px;align-items:center;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:14px 16px;text-align:left;margin-bottom:10px}
.provider:hover{border-color:var(--blue)}
.provider[aria-pressed=true]{border-color:var(--blue);background:var(--selected)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:0 0 18px 34px;font-size:13px}
.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:600}
.steps li.done:before{background:var(--blue);border-color:var(--blue);color:#fff;content:'✓'}
.steps small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.modal-back{position:fixed;inset:0;background:#0006;display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--paper);border-radius:14px;max-width:460px;width:100%;padding:24px;border:1px solid var(--line)}
.modal h3{font:600 20px 'Manrope',sans-serif;letter-spacing:-.6px;margin-bottom:8px}
.radio{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-top:8px;font-size:13px}
.todo .trow{grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) auto}
.design-note{max-width:1280px;margin:0 auto 14px;font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.design-note b{color:var(--text)}

@media(max-width:1050px){.nav button{padding:8px 9px}.crumb{display:none}}
@media(max-width:900px){
 .content{padding:24px 20px 16px}.hdr{padding:16px 20px;gap:16px;flex-wrap:wrap}
 .nav{order:3;width:100%;margin:0;overflow-x:auto}
 .bench{grid-template-columns:235px minmax(0,1fr)}
 .stats{gap:17px}.stat{padding-left:17px}h1{font-size:30px}.stat strong{font-size:26px}
 .rhead{padding:21px 21px 0}.panel{padding:20px 21px}.bottom{padding:15px 21px}.astatus{display:none}
 .jobs .trow{grid-template-columns:minmax(0,2fr) .8fr .8fr .8fr}.jobs .hide-md{display:none}
 .inbox .trow{grid-template-columns:minmax(0,2fr) minmax(0,1.6fr) 1fr}.inbox .hide-md{display:none}
 .connect{grid-template-columns:1fr}.connect>div+div{border-left:0;border-top:1px solid var(--line)}
}
@media(max-width:680px){
 body{padding:0}.app{border-radius:0;border:0}
 .acct>div{display:none}
 .hero{flex-direction:column;align-items:start;gap:22px;margin-bottom:22px}h1{font-size:30px}
 .stats{width:100%;justify-content:space-between;gap:10px}.stat{padding-left:14px;flex:1}.stat:first-child{padding-left:0;border:0}
 .content{padding:22px 14px 14px}
 .seg{width:100%;justify-content:space-between;gap:0}.seg button{padding:8px;font-size:11px}
 .select{width:100%}
 .bench{display:block}.queue{border:0}.review{display:none}
 .app.mreview .review{display:flex}.app.mreview .queue,.app.mreview .hero,.app.mreview .toolbar{display:none}
 .app.mreview .back{display:inline-flex}
 .app.focus:not(.mreview) .queue{display:block}
 .rhead{padding:20px 18px 0}.panel{padding:20px 18px;min-height:340px}h2{font-size:24px}
 .ident .av{width:48px;height:48px;border-radius:13px}
 .bottom{padding:15px 18px}.actions{display:grid;grid-template-columns:1fr 1.5fr;width:100%}
 .req{grid-template-columns:1fr;gap:6px}.verdict{justify-self:start}
 .jobs .trow{grid-template-columns:minmax(0,1fr) auto}.jobs .hide-sm{display:none}
 .inbox .trow{grid-template-columns:minmax(0,1fr) auto}.inbox .hide-sm{display:none}
 .todo .trow{grid-template-columns:minmax(0,1fr) auto}.todo .hide-sm{display:none}
 .rules{grid-template-columns:1fr}.rules div{border-right:0;border-bottom:1px solid var(--line)}
 .focus-btn{display:none!important}
 input,select,textarea{font-size:16px!important}
}
@media(pointer:coarse){button{min-height:44px}.ib{min-width:44px}}
</style>
</head>
<body>
<p class="design-note"><b>Phase 5B UI design, for review.</b> Interactive prototype with fictional candidates. Nothing is sent and no mailbox is connected. Try the tabs, the filters, Shortlist and Reject, and the Inbox connection.</p>
<div class="app" id="app">
 <header class="hdr">
  <div class="brand"><span class="mark" aria-hidden="true"><b></b><b></b><b></b></span>hira</div>
  <div class="crumb">Northwind Talent <span>/</span> <b>Recruitment</b></div>
  <nav class="nav" aria-label="Main" id="nav"></nav>
  <div class="acct"><div><p style="font-size:12px;font-weight:600">Olivia Martin</p><small>Recruiter</small></div><span class="av">OM</span></div>
 </header>
 <main class="content" id="main"></main>
</div>

<template id="tpl-modal"><div class="modal-back" role="dialog" aria-modal="true"><div class="modal"></div></div></template>

<script>
"use strict";
/* ---------- icons (inline, no runtime) ---------- */
const P={
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',left:'<path d="m15 18-6-6 6-6"/>',right:'<path d="m9 18 6-6-6-6"/>',
 pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
 brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
