name: recruit-agent

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://recruit:recruit@postgres:5432/recruit
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recruit
      POSTGRES_PASSWORD: recruit
      POSTGRES_DB: recruit
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruit -d recruit"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # S3 compatible CV storage. Only its own settings are passed in (not the app's keys).
  # MINIO_KMS_SECRET_KEY enables server side encryption (SSE-S3) for every object.
  # MinIO stopped publishing images on Docker Hub and Quay in 2025; this is Chainguard's
  # build of the same server. It has no shell, so readiness is checked by the API on
  # start (S3Storage.ensure_bucket retries) instead of a container healthcheck.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run make local-env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run make local-env}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?run make local-env}
    ports: ["9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment: *app-env
    command: sh -c "alembic upgrade head && uvicorn app.api.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build: .
    env_file:
      - path: .env
        required: false
    environment: *app-env
    command: arq app.workers.worker.WorkerSettings
    depends_on:
      api: {condition: service_healthy}

  # Recruiter dashboard (phase 4). Only these settings are passed in; the browser never
  # sees the API token (the dashboard's server adds it to each API call).
  dashboard:
    build: ./dashboard
    environment:
      API_URL: http://api:8000
      RECRUITER_TOKEN: ${RECRUITER_TOKEN:?run make local-env}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?run make local-env}
      SESSION_SECRET: ${SESSION_SECRET:?run make local-env}
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
  miniodata:
