name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: product
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recruit
          POSTGRES_PASSWORD: recruit
          POSTGRES_DB: recruit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recruit -d recruit"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # No secrets in CI: fake model, no-op tracer.
      ENVIRONMENT: ci
      DATABASE_URL: postgresql+psycopg://recruit:recruit@localhost:5432/recruit
      TEST_DATABASE_URL: postgresql+psycopg://recruit:recruit@localhost:5432/recruit_test
      REDIS_URL: redis://localhost:6379/0
      # Throwaway MinIO for the storage encryption test (not a real secret).
      S3_TEST: "1"
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: ci-minio
      S3_SECRET_KEY: ci-minio-password-only-for-ci  # gitleaks:allow
    steps:
      - uses: actions/checkout@v4

      - name: Start MinIO with server side encryption
        run: |
          KMS="ci-key:$(head -c 32 /dev/urandom | base64)"
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
            -e MINIO_KMS_SECRET_KEY="$KMS" cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do curl -fs http://localhost:9000/minio/health/live && break; sleep 1; done

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint and type check
        run: make lint

      - name: Migrations up, down, up on a fresh database
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Tests (incl. real MinIO encryption test)
        run: make test

      - name: Fast eval suite (gate)
        run: make eval

      - name: Harness self test (planted regression must fail the gate)
        run: make eval-selftest

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: product/evals/reports/
          if-no-files-found: warn

  dashboard:
    # Phase 4: type check, unit tests, the secret exposure check, and a production build
    # with settings from the environment only (Vercel ready).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: product/dashboard
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product/dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx next typegen && npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: No secrets exposed to browser code
        run: node scripts/check-public-env.mjs
      - name: Production build
        run: npx next build

  e2e:
    # Phase 4: the whole stack in Docker, seeded offline (no model, no secrets), then the
    # browser tests (review speed, blind review, token exposure, overrides, accessibility).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen
      - name: Local settings for this run only
        run: cp .env.example .env && make local-env
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Dashboard packages for the test runner
        working-directory: product/dashboard
        run: npm ci --no-audit --no-fund
      - name: Browser tests
        run: make e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: product/dashboard/test-results/
          if-no-files-found: ignore

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --redact --verbose --exit-code 1
      - name: No .env committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then echo "a .env file is tracked"; exit 1; fi
