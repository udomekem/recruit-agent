<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}{{ company }}{% endblock %}</title>
  <style>
    :root { --ink:#1d2330; --muted:#5b6475; --line:#d9dde5; --accent:#2457d6; --bad:#b42318; --bg:#f7f8fa; }
    * { box-sizing: border-box; }
    body { margin:0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--bg); }
    main { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:24px; margin-bottom:20px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; } h2 { font-size: 1.1rem; margin: 0 0 12px; }
    .meta { color: var(--muted); margin: 0; }
    label { display:block; font-weight:600; margin: 16px 0 6px; }
    input[type=text], input[type=email], input[type=tel], input[type=number], select, textarea {
      width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
    textarea { min-height: 80px; }
    .choice { display:flex; gap:8px; align-items:center; font-weight:400; margin:6px 0; }
    .error { color: var(--bad); font-size: .92rem; margin: 4px 0 0; }
    .notice li { margin-bottom: 6px; } .small { color: var(--muted); font-size: .92rem; }
    button { background: var(--accent); color:#fff; border:0; border-radius:8px; padding:12px 20px; font: 600 1rem/1 inherit; cursor:pointer; margin-top: 20px; }
    .banner { border-left: 4px solid var(--bad); padding: 10px 14px; background:#fff4f2; margin-bottom: 16px; }
  </style>
</head>
<body><main>{% block body %}{% endblock %}</main></body>
</html>
